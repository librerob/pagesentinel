name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub preview release after all checks (main only)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build && npm run validate
      - run: node scripts/benchmark.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run package
      - run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v$version" "artifacts/pagesentinel-$version.zip" artifacts/SHA256SUMS --target "$GITHUB_SHA" --title "PageSentinel v$version preview" --notes-file docs/RELEASE_NOTES.md --prerelease
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: pagesentinel-release-validation
          path: |
            artifacts/
            docs/screenshots/
            test-results/
